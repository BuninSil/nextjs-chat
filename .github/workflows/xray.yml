name: Build Xray core

# Собирает ядро Xray (для серверов XHTTP) под Android arm64 из официальных исходников
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/xray.yml"

permissions:
  contents: write

jobs:
  xray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build xray for android/arm64
        run: |
          git clone --depth 1 --branch v26.9.30 https://github.com/XTLS/Xray-core /tmp/xray
          cd /tmp/xray
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w -buildid= -checklinkname=0" -o libxray.so ./main
          ls -la libxray.so
      - name: Publish to xraybin branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pub && cp /tmp/xray/libxray.so /tmp/pub/
          cd /tmp/pub && echo "v26.9.30" > VERSION && git init -q && git checkout -q -b xraybin
          git add . && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "xray v26.9.30 android arm64"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" xraybin
