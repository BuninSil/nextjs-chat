name: Fast VPN APK

on:
  push:
    branches:
      - "**"
    tags:
      - "mlbb-v*"
    paths:
      - "mlbb-overlay/**"
      - ".github/workflows/mlbb-overlay-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlbb-overlay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK, CMake, platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # Блок рекламы: свежий список при каждой сборке (не скачался — остаётся тот, что в репозитории)
      - name: Fresh ad block list
        continue-on-error: true
        run: bash tools/build-ads.sh app/src/main/assets/rules/geosite-category-ads-all.srs

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/fast-vpn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fast-vpn-debug
          path: /tmp/fast-vpn.apk

      # Релиз — источник автообновления в приложении (versionCode = номер запуска).
      # Префикс тега mlbb-v не меняем: по нему уже установленные версии находят обновления.
      # Публикация APK в ветку разрешена только при явном официальном Android-теге.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/mlbb-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" /tmp/fast-vpn.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fast VPN 1.0.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%B "$GITHUB_SHA")" --latest

      # Копия APK в ветке apk-builds (перезаписывается), чтобы забрать её обычным git fetch
      - name: Publish APK to apk-builds branch
        if: startsWith(github.ref, 'refs/tags/mlbb-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pub && cp /tmp/fast-vpn.apk /tmp/pub/fast-vpn.apk
          cd /tmp/pub
          echo "${GITHUB_SHA}" > SOURCE_COMMIT
          git init -q && git checkout -q -b apk-builds
          git add . && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Official Android APK ${GITHUB_REF_NAME} from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
