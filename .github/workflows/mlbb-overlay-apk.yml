name: Fast VPN APK

on:
  push:
    branches:
      - "**"
    tags:
      - "mlbb-v*"
    paths:
      - "mlbb-overlay/**"
      - ".github/workflows/mlbb-overlay-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SPACEWEB_HOST: ${{ secrets.SPACEWEB_HOST }}
      SPACEWEB_USER: ${{ secrets.SPACEWEB_USER }}
      SPACEWEB_PASSWORD: ${{ secrets.SPACEWEB_PASSWORD }}
      SPACEWEB_FINGERPRINT: ${{ secrets.SPACEWEB_FINGERPRINT }}
      SPACEWEB_INCOMING_PATH: ${{ secrets.SPACEWEB_INCOMING_PATH }}
      SPACEWEB_SITE_URL: ${{ secrets.SPACEWEB_SITE_URL }}
      SPACEWEB_PUBLISH_SECRET: ${{ secrets.SPACEWEB_PUBLISH_SECRET }}
    defaults:
      run:
        working-directory: mlbb-overlay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK, CMake, platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # Блок рекламы: свежий список при каждой сборке (не скачался — остаётся тот, что в репозитории)
      - name: Fresh ad block list
        continue-on-error: true
        run: bash tools/build-ads.sh app/src/main/assets/rules/geosite-category-ads-all.srs

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/fast-vpn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fast-vpn-debug
          path: /tmp/fast-vpn.apk

      # Релиз — источник автообновления в приложении (versionCode = номер запуска).
      # Префикс тега mlbb-v не меняем: по нему уже установленные версии находят обновления.
      # Публикация APK в ветку разрешена только при явном официальном Android-теге.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/mlbb-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" /tmp/fast-vpn.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fast VPN 1.0.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%B "$GITHUB_SHA")" --latest

      # Копия APK в ветке apk-builds (перезаписывается), чтобы забрать её обычным git fetch
      - name: Publish APK to apk-builds branch
        if: startsWith(github.ref, 'refs/tags/mlbb-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pub && cp /tmp/fast-vpn.apk /tmp/pub/fast-vpn.apk
          cd /tmp/pub
          echo "${GITHUB_SHA}" > SOURCE_COMMIT
          git init -q && git checkout -q -b apk-builds
          git add . && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Official Android APK ${GITHUB_REF_NAME} from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-builds

      # Публикация в SpaceWeb включается только при настроенных Secrets и официальном теге.
      # SSH/SFTP на бесплатном тестовом периоде может быть выключен в панели SpaceWeb.
      - name: Prepare APK for SpaceWeb
        if: startsWith(github.ref, 'refs/tags/mlbb-v')
        run: |
          mkdir -p deploy
          cp /tmp/fast-vpn.apk deploy/fast-vpn.apk
          SHA="$(sha256sum deploy/fast-vpn.apk | cut -d' ' -f1)"
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          CODE="${GITHUB_RUN_NUMBER}"
          SIGNATURE="$(printf '%s\n%s\n%s' "$VERSION" "$CODE" "$SHA" | openssl dgst -sha256 -hmac "$SPACEWEB_PUBLISH_SECRET" | awk '{print $2}')"
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "APK_PUBLISH_SIGNATURE=$SIGNATURE" >> "$GITHUB_ENV"

      - name: Upload APK to SpaceWeb (SFTP)
        if: startsWith(github.ref, 'refs/tags/mlbb-v') && env.SPACEWEB_HOST != '' && env.SPACEWEB_USER != '' && env.SPACEWEB_PASSWORD != '' && env.SPACEWEB_FINGERPRINT != '' && env.SPACEWEB_INCOMING_PATH != '' && env.SPACEWEB_SITE_URL != '' && env.SPACEWEB_PUBLISH_SECRET != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SPACEWEB_HOST }}
          username: ${{ secrets.SPACEWEB_USER }}
          password: ${{ secrets.SPACEWEB_PASSWORD }}
          port: 22
          fingerprint: ${{ secrets.SPACEWEB_FINGERPRINT }}
          source: "mlbb-overlay/deploy/fast-vpn.apk"
          target: ${{ secrets.SPACEWEB_INCOMING_PATH }}
          strip_components: 1
          overwrite: true

      - name: Activate APK on SpaceWeb and remove previous version
        if: startsWith(github.ref, 'refs/tags/mlbb-v') && env.SPACEWEB_HOST != '' && env.SPACEWEB_USER != '' && env.SPACEWEB_PASSWORD != '' && env.SPACEWEB_FINGERPRINT != '' && env.SPACEWEB_INCOMING_PATH != '' && env.SPACEWEB_SITE_URL != '' && env.SPACEWEB_PUBLISH_SECRET != ''
        run: |
          BODY="$(printf '{"version":"%s","version_code":%s,"sha256":"%s"}' "$APK_VERSION" "$APK_VERSION_CODE" "$APK_SHA256")"
          curl --fail --silent --show-error --max-time 20 \
            -X POST "$SPACEWEB_SITE_URL/api/publish.php" \
            -H "Content-Type: application/json" \
            -H "X-Publish-Signature: $APK_PUBLISH_SIGNATURE" \
            --data "$BODY"
